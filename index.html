<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join My WhatsApp Channel</title>
    <style>
        /* দ্রুত লোডিংয়ের জন্য বেসিক রিসেট */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            width: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        /* ফুল স্ক্রিন ব্যাকগ্রাউন্ড ইমেজ (f1.webp) */
        .landing-page {
            background-image: linear-gradient(rgba(0,0,0,0.1), rgba(0,0,0,0.1)), url('f1.webp');
            height: 100vh;
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: flex-end; /* বাটন নিচে রাখার জন্য */
            padding-bottom: 80px; /* নিচ থেকে হাফ ইঞ্চির একটু বেশি উপরে রাখা হয়েছে */
        }

        /* আকর্ষণীয় হোয়াটসঅ্যাপ বাটন */
        .whatsapp-btn {
            background-color: #25D366; /* WhatsApp Green */
            color: white;
            text-decoration: none;
            padding: 20px 50px;
            border-radius: 50px;
            font-size: 22px;
            font-weight: bold;
            text-transform: uppercase;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            transition: 0.3s;
            animation: pulse-animation 1.5s infinite; /* বাটন পপ-আপ ইফেক্ট */
            display: inline-block;
            text-align: center;
        }

        /* বাটনটি নাড়াচাড়া করার বা পপ-আপ করার অ্যানিমেশন */
        @keyframes pulse-animation {
            0% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.7);
            }
            70% {
                transform: scale(1.05);
                box-shadow: 0 0 0 15px rgba(37, 211, 102, 0);
            }
            100% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(37, 211, 102, 0);
            }
        }

        /* বাটনে মাউস নিলে অ্যানিমেশন স্টপ হবে এবং কালার চেঞ্জ হবে */
        .whatsapp-btn:hover {
            background-color: #128C7E;
            transform: translateY(-3px);
            animation-play-state: paused;
        }

    </style>
</head>
<body>

    <div class="landing-page">
        <!-- আপনার দেওয়া হোয়াটসঅ্যাপ চ্যানেল লিঙ্ক -->
        <a href="https://whatsapp.com/channel/0029Vb8E6XW002T0uNPN4S3D" class="whatsapp-btn">
            Visit Now
        </a>
    </div>

</body>
</html>
